<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<title>Life OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sun:#F6E58D;--gold:#F9CA24;--white:#FFFFFF;--coral:#FF6F61;--plum:#6A5B8A;
  --sun-soft:#FDF8DC;--coral-soft:#FFF0EE;--plum-soft:#F0EDF7;
  --ink:#1C1828;--ink2:#4A4560;--ink3:#8B879E;--ink4:#C4C1D0;
  --bg:#FAFAF8;--bg2:#F4F3EF;--bg3:#EEECEA;
  --border:#E0DED8;--border2:#D0CDCA;
  --r:14px;--r-sm:8px;--r-lg:20px;
  font-family:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--ink);min-height:100vh}
#app{display:flex;min-height:100vh}
#sb{width:230px;background:var(--plum);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-top{padding:1.75rem 1.5rem 1.25rem}
.sb-brand{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:300;color:var(--sun);letter-spacing:-.01em;line-height:1.2}
.sb-brand em{font-style:italic;color:#FDF8DC}
.sb-tagline{font-size:.7rem;color:rgba(246,229,141,.4);letter-spacing:.1em;text-transform:uppercase;margin-top:.3rem}
.sb-divider{height:1px;background:rgba(255,255,255,.1);margin:.75rem 0}
.sb-label{font-size:.63rem;color:rgba(246,229,141,.4);padding:.5rem 1.5rem .25rem;letter-spacing:.12em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:.75rem;padding:.6rem 1.5rem;cursor:pointer;transition:all .15s;font-size:.83rem;color:rgba(255,255,255,.6);border-right:3px solid transparent}
.sb-item:hover{color:var(--sun);background:rgba(246,229,141,.08)}
.sb-item.on{color:var(--sun);background:rgba(246,229,141,.12);border-right-color:var(--gold)}
.sb-ic{font-size:.95rem;width:18px;text-align:center;flex-shrink:0}
.sb-bottom{margin-top:auto;padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,.1)}
.sb-date{font-size:.72rem;color:rgba(246,229,141,.35);text-align:center}
#main{flex:1;overflow:auto}
.pg-head{margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.pg-title{font-family:'Fraunces',serif;font-size:2.1rem;font-weight:300;color:var(--ink);line-height:1.2}
.pg-title em{font-style:italic;color:var(--plum)}
.pg-sub{font-size:.85rem;color:var(--ink3);margin-top:.4rem}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem 1.5rem;margin-bottom:1rem}
.card-head{font-size:.68rem;color:var(--ink4);letter-spacing:.09em;text-transform:uppercase;margin-bottom:.9rem;font-weight:500}
.card-accent{border-left:3px solid var(--coral)}
.card-sun{border-left:3px solid var(--gold)}
.card-plum{border-left:3px solid var(--plum)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.25rem}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat.s-gold::before{background:var(--gold)}.stat.s-coral::before{background:var(--coral)}.stat.s-plum::before{background:var(--plum)}
.stat-label{font-size:.68rem;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:.35rem}
.stat-val{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:300;color:var(--ink);line-height:1}
.stat-val.c-gold{color:var(--gold)}.stat-val.c-coral{color:var(--coral)}.stat-val.c-plum{color:var(--plum)}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem;border-radius:var(--r-sm);border:none;cursor:pointer;font-size:.82rem;font-family:'DM Sans',sans-serif;font-weight:500;tran[...]
.btn-sun{background:var(--gold);color:var(--ink)}.btn-sun:hover{background:var(--sun)}
.btn-coral{background:var(--coral);color:#fff}.btn-coral:hover{filter:brightness(1.08)}
.btn-plum{background:var(--plum);color:#fff}.btn-plum:hover{filter:brightness(1.1)}
.btn-plum{background:var(--plum);color:#fff;border:none}.btn-plum:hover{filter:brightness(1.1)}
.btn-del{background:transparent;color:var(--coral);border:1px solid transparent;font-size:.75rem;padding:.28rem .6rem;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-del:hover{background:var(--coral-soft);border-color:var(--coral)}
#toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.65rem 1.25rem;border-radius:var(--r-sm);font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none[...]
#toast.show{opacity:1}
#databar{background:var(--plum-soft);border-bottom:1px solid #d6d0e8;padding:.55rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
#databar-txt{font-size:.75rem;color:var(--plum)}
.btn-import{background:var(--gold);color:var(--ink);border:none;border-radius:var(--r-sm);padding:.38rem .85rem;font-size:.75rem;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;display[...]
.btn-import:hover{background:var(--sun)}
#toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.65rem 1.2rem;border-radius:var(--r-sm);font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;[...]
#toast.show{opacity:1}
#databar{background:var(--plum-soft);border-bottom:1px solid #d6d0e8;padding:.55rem 2.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
#databar-txt{font-size:.75rem;color:var(--plum);font-weight:500}
#databar-actions{display:flex;gap:.5rem;align-items:center}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink);padding:.58rem .9rem;font-size:.84rem;font-family:'DM Sans',sans-serif;width:100%;[...]
input:focus,select:focus,textarea:focus{border-color:var(--plum);background:var(--white)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
label{font-size:.76rem;color:var(--ink2);display:block;margin-bottom:.32rem;font-weight:500}
.row{display:grid;gap:.75rem;margin-bottom:.75rem}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{color:var(--ink3);font-weight:500;text-align:left;padding:.6rem .8rem;border-bottom:2px solid var(--border);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase}
td{padding:.75rem .8rem;border-bottom:1px solid var(--bg3);color:var(--ink);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--sun-soft)}
.tag{display:inline-block;padding:.18rem .55rem;border-radius:20px;font-size:.7rem;font-weight:500;white-space:nowrap}
.tg-sun{background:var(--sun);color:#7a6200}.tg-coral{background:var(--coral-soft);color:#c24035;border:1px solid #fcd9d6}
.tg-plum{background:var(--plum-soft);color:var(--plum);border:1px solid #d6d0e8}.tg-teal{background:#e1f5ee;color:#0f6e56;border:1px solid #a8dece}
.tg-ink{background:var(--bg3);color:var(--ink2);border:1px solid var(--border)}
.tl{padding-left:1.5rem;position:relative}
.tl::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--gold),var(--coral),var(--plum))}
.tl-item{position:relative;margin-bottom:1.25rem;padding-left:1rem}
.tl-dot{position:absolute;left:-1.575rem;top:.5rem;width:10px;height:10px;border-radius:50%;background:var(--white);border:2.5px solid var(--gold)}
.tl-date{font-size:.7rem;color:var(--ink3);margin-bottom:.2rem;letter-spacing:.04em}
.tl-title{font-size:.9rem;font-weight:500;color:var(--ink);margin-bottom:.15rem}
.tl-note{font-size:.79rem;color:var(--ink2);font-style:italic;line-height:1.5}
.mood-ring{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:1rem;font-weight:500;flex-shrink:0}
.letter{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.5rem;margin-bottom:1rem;position:relative}
.letter-seal{position:absolute;top:1rem;right:1rem;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.letter-open{background:var(--sun);color:#7a6200}.letter-locked{background:var(--plum-soft);color:var(--plum)}
.letter-body{font-family:'Fraunces',serif;font-weight:300;font-size:.92rem;line-height:1.85;color:var(--ink);white-space:pre-wrap;padding:1rem;background:var(--sun-soft);border-radius:var(--r-sm);bord[...]
.quote-box{background:var(--plum);border-radius:var(--r-lg);padding:1.5rem;margin-bottom:1rem;position:relative;overflow:hidden}
.quote-box::before{content:'\201C';font-family:'Fraunces',serif;font-size:6rem;color:rgba(249,202,36,.12);position:absolute;top:-1rem;left:.5rem;line-height:1}
.quote-text{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:300;font-style:italic;color:#FDF8DC;line-height:1.65;position:relative}
.quote-attr{font-size:.72rem;color:rgba(246,229,141,.4);margin-top:.6rem;position:relative}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.25rem}
.tile{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.2rem;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-2px);border-color:var(--plum);box-shadow:0 6px 20px rgba(106,91,138,.1)}
.tile-ic{font-size:1.2rem;margin-bottom:.6rem}
.tile-count{font-family:'Fraunces',serif;font-size:1.75rem;font-weight:300;line-height:1;margin-bottom:.2rem}
.tile-count.c-gold{color:var(--gold)}.tile-count.c-coral{color:var(--coral)}.tile-count.c-plum{color:var(--plum)}
.tile-name{font-size:.82rem;font-weight:500;color:var(--ink);margin-bottom:.15rem}
.tile-desc{font-size:.72rem;color:var(--ink3)}
.tile-bar{position:absolute;bottom:0;left:0;right:0;height:3px}
.id-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.id-cell{background:var(--bg2);border-radius:var(--r);padding:.9rem 1rem;border:1px solid var(--border)}
.id-cell-label{font-size:.67rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem}
.id-cell-val{font-size:.88rem;color:var(--ink);font-style:italic;font-family:'Fraunces',serif;font-weight:300;line-height:1.4}
.pbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:.4rem}
.pbar-fill{height:100%;border-radius:3px}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--ink4)}
.empty-ic{font-size:2rem;margin-bottom:.75rem;opacity:.5}
.empty-txt{font-size:.85rem}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
@media(max-width:620px){
  #sb{width:54px}.sb-brand,.sb-tagline,.sb-label,.sb-item span,.sb-date{display:none}
  .sb-item{justify-content:center;padding:.72rem}
  #main{padding:1rem}.tiles{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}
  .c2,.c3{grid-template-columns:1fr}.id-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
<nav id="sb">
  <div class="sb-top">
    <div class="sb-brand">Life <em>OS</em></div>
    <div class="sb-tagline">Your private universe</div>
  </div>
  <div class="sb-divider"></div>
  <div style="padding:.25rem 0">
    <div class="sb-label">Overview</div>
    <div class="sb-item on" data-p="home"><span class="sb-ic">◈</span><span>Dashboard</span></div>
  </div>
  <div style="padding:.25rem 0">
    <div class="sb-label">Modules</div>
    <div class="sb-item" data-p="finance"><span class="sb-ic">💰</span><span>Finance</span></div>
    <div class="sb-item" data-p="relations"><span class="sb-ic">🤝</span><span>Relationships</span></div>
    <div class="sb-item" data-p="timeline"><span class="sb-ic">📍</span><span>Timeline</span></div>
    <div class="sb-item" data-p="checkins"><span class="sb-ic">🧠</span><span>Check-ins</span></div>
    <div class="sb-item" data-p="identity"><span class="sb-ic">✨</span><span>Identity</span></div>
    <div class="sb-item" data-p="letters"><span class="sb-ic">📩</span><span>Letters</span></div>
  </div>
  <div style="padding:.25rem 0">
    <div class="sb-label">System</div>
    <div class="sb-item" data-p="settings"><span class="sb-ic">⚙</span><span>Data &amp; backup</span></div>
  </div>
  <div class="sb-bottom"><div class="sb-date" id="sb-date"></div></div>
</nav>
<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
<div id="databar">
  <div id="databar-txt">💾 Data saved locally in your browser. Export regularly to keep a safe backup.</div>
  <div style="display:flex;gap:.5rem;align-items:center;flex-shrink:0">
    <button class="btn btn-plum" style="font-size:.75rem;padding:.38rem .9rem" onclick="exportData()">⬇ Export JSON</button>
    <label class="btn-import" for="imp-file">⬆ Import JSON</label>
    <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>
<main id="main" style="flex:1;overflow:auto;padding:2rem 2.25rem"></main>
</div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const now=new Date();
document.getElementById('sb-date').textContent=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const mem={};
async function get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return mem[k]||null}}
async function set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
const D={page:'home',finance:{records:[],memories:{first:'',worst:'',smartest:''}},relations:{people:[]},timeline:{events:[]},checkins:{entries:[]},identity:{aesthetic:'',music:'',hobbies:'',tech:'',inspirations:''},letters:{list:[]}};
async function boot(){for(const k of['finance','relations','timeline','checkins','identity','letters']){const d=await get('livos_'+k);if(d)D[k]=d;}render();}
async function save(k){await set('livos_'+k,D[k]);}
const fmtMoney=n=>Number(n||0).toLocaleString()+' FCFA';
const fmtDate=s=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});};
const fmtMonth=s=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'long',year:'numeric'});};
const moodColor=n=>['','#E24B4A','#E24B4A','#FF6F61','#F9CA24','#F9CA24','#6AABD6','#6AABD6','#4DB8A0','#4DB8A0','#1D9E75'][Math.min(10,Math.max(1,n))];
const quotes=[{t:"The two most important days in your life are the day you were born and the day you find out why.",a:"Mark Twain"},{t:"You are the author of your own story. Write something worth reading or do something worth writing.",a:"Benjamin Franklin"},{t:"The only time to eat diet food is while you're waiting for the steak to cook.",a:"Julia Child"},{t:"Everything you want is on the other side of fear.",a:"Jack Canfield"},{t:"We accept the love we think we deserve.",a:"Stephen Chbosky"},{t:"Today is the right day to start living your life.",a:"Unknown"}];
const todayQ=quotes[now.getDate()%quotes.length];
function nav(p){D.page=p;document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('on',el.dataset.p===p));render();}
window.nav=nav;
function pgHome(){
  const F=D.finance,R=D.relations,T=D.timeline,C=D.checkins,L=D.letters;
  const totInc=F.records.reduce((a,x)=>a+(+x.income||0),0);
  const totExp=F.records.reduce((a,x)=>a+(+x.expenses||0),0);
  const lastMood=C.entries.length?C.entries[C.entries.length-1].mood:null;
  const nextLetter=L.list.filter(l=>new Date(l.openDate)>now).sort((a,b)=>new Date(a.openDate)-new Date(b.openDate))[0];
  const tiles=[
    {p:'finance',ic:'💰',count:F.records.length,unit:'records',name:'Finance tracker',desc:'Income & expenses',cc:'c-gold',bar:'background:var(--gold)'},
    {p:'relations',ic:'🤝',count:R.people.length,unit:'people',name:'Relationships',desc:'Your circle',cc:'c-plum',bar:'background:var(--plum)'},
    {p:'timeline',ic:'📍',count:T.events.length,unit:'events',name:'Life timeline',desc:'Your story',cc:'c-coral',bar:'background:var(--coral)'},
    {p:'checkins',ic:'🧠',count:C.entries.length,unit:'entries',name:'Check-ins',desc:'Mental health log',cc:'c-gold',bar:'background:var(--gold)'},
    {p:'identity',ic:'✨',count:'✦',unit:'',name:'Identity',desc:'Who you are now',cc:'c-plum',bar:'background:var(--plum)'},
    {p:'letters',ic:'📩',count:L.list.length,unit:'letters',name:'Future letters',desc:'Sealed messages',cc:'c-coral',bar:'background:var(--coral)'},
  ];
  return `
  <div class="pg-head"><div class="pg-title">Welcome back, <em>explorer.</em></div><div class="pg-sub">Every day is a data point. Every moment, a chapter. This is your life in full.</div></div>
  <div class="quote-box"><div class="quote-text">${todayQ.t}</div><div class="quote-attr">— ${todayQ.a}</div></div>
  <div class="stats">
    <div class="stat s-gold"><div class="stat-label">Total income</div><div class="stat-val c-gold">${totInc?fmtMoney(totInc):'—'}</div></div>
    <div class="stat s-coral"><div class="stat-label">Total expenses</div><div class="stat-val c-coral">${totExp?fmtMoney(totExp):'—'}</div></div>
    <div class="stat s-plum"><div class="stat-label">Last mood</div><div class="stat-val c-plum">${lastMood?lastMood+'/10':'—'}</div></div>
  </div>
  <div class="tiles">${tiles.map(t=>`<div class="tile" onclick="nav('${t.p}')"><div class="tile-ic">${t.ic}</div><div class="tile-count ${t.cc}">${t.count}</div><div style="font-size:.65rem;color:var(--ink3)">${t.name}</div><div style="font-size:.62rem;color:var(--ink4);margin-top:.35rem">${t.unit}</div><div class="tile-bar" style="${t.bar}"></div></div>`).join('')}
  </div>
  ${T.events.length?`<div class="card card-sun"><div class="card-head">Recent milestones</div><div class="tl">${[...T.events].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3).map(e=>`<div class="tl-item"><div class="tl-date">${fmtDate(e.date)}</div><div class="tl-title">${e.title}</div><div class="tl-note">${e.note||'No reflection added'}</div></div>`).join('')}</div></div>`:''}
  ${nextLetter?`<div class="card card-plum" style="background:var(--plum-soft)"><div class="card-head">Next letter unlocks</div><div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:.7rem;color:var(--plum);letter-spacing:.07em;text-transform:uppercase;margin-bottom:.35rem">${nextLetter.occasion||'A letter'}</div><div style="font-family:'Fraunces',serif;font-size:1.3rem;font-weight:300;color:var(--plum)">${Math.ceil((new Date(nextLetter.openDate)-now)/86400000)} days</div></div></div></div>`:''}
`;
}
function pgFinance(){
  const F=D.finance;
  const recs=[...F.records].sort((a,b)=>new Date(b.month)-new Date(a.month));
  const totInc=recs.reduce((a,x)=>a+(+x.income||0),0);
  const totExp=recs.reduce((a,x)=>a+(+x.expenses||0),0);
  const totSav=recs.reduce((a,x)=>a+(+x.savings||0),0);
  const catC={Job:'tg-teal',Freelance:'tg-plum','Side hustle':'tg-coral',Gift:'tg-sun',Other:'tg-ink'};
  return `
  <div class="pg-head"><div class="pg-title">Financial <em>Tracker</em></div><div class="pg-sub">Watch your financial independence grow, one month at a time.</div></div>
  <div class="stats"><div class="stat s-gold"><div class="stat-label">Total income</div><div class="stat-val c-gold">${fmtMoney(totInc)}</div></div><div class="stat s-coral"><div class="stat-label">Total expenses</div><div class="stat-val c-coral">${fmtMoney(totExp)}</div></div><div class="stat s-plum"><div class="stat-label">Total saved</div><div class="stat-val c-plum">${fmtMoney(totInc-totExp)}</div></div></div>
  <div class="card">
    <div class="card-head">Add a monthly record</div>
    <div class="row c2"><div><label>Month</label><input type="month" id="fi-m" max="${now.toISOString().slice(0,7)}"></div><div><label>Source</label><select id="fi-cat"><option>Job</option><option>Freelance</option><option>Side hustle</option><option>Gift</option><option>Other</option></select></div></div>
    <div class="row c3"><div><label>Income (FCFA)</label><input type="number" id="fi-i" placeholder="0" min="0"></div><div><label>Expenses (FCFA)</label><input type="number" id="fi-e" placeholder="0" min="0"></div><div><label>Savings (FCFA)</label><input type="number" id="fi-s" placeholder="0" min="0"></div></div>
    <div class="row"><div><label>Note</label><input type="text" id="fi-n" placeholder="e.g. First salary ever!"></div></div>
    <button class="btn btn-sun" onclick="addFin()">+ Add record</button>
  </div>

window.exportData=()=>{
  const payload={version:1,exported:new Date().toISOString(),finance:D.finance,relations:D.relations,timeline:D.timeline,checkins:D.checkins,identity:D.identity,letters:D.letters};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const dateStr=new Date().toISOString().slice(0,10);
  a.download='lifeos-backup-'+dateStr+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('✓ Backup downloaded!');
};
window.importData=async(e)=>{
  const file=e.target.files[0];
  if(!file)return;
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    if(!parsed.finance||!parsed.relations){throw new Error('Invalid file');}
    if(!confirm('Import this backup? Your current data will be replaced.'))return;
    D.finance=parsed.finance;
    D.relations=parsed.relations;
    D.timeline=parsed.timeline||{events:[]};
    D.checkins=parsed.checkins||{entries:[]};
    D.identity=parsed.identity||{aesthetic:'',music:'',hobbies:'',tech:'',inspirations:''};
    D.letters=parsed.letters||{list:[]};
    for(const k of['finance','relations','timeline','checkins','identity','letters'])await save(k);
    e.target.value='';
    render();
    toast('✓ Data imported successfully!');
  }catch(err){toast('✗ Invalid backup file. Please use a Life OS export.',true);}
};
